<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);

            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
        }

        .login-button {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 15px 0;

            border: none;
            border-radius: 6px;

            font-size: 16px;
            cursor: pointer;

            text-decoration: none;
            box-sizing: border-box;
        }

        .google {
            background: #4285f4;
            color: white;
        }

        .github {
            background: #24292e;
            color: white;
        }

        .login-button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>Login</h1>

    <!-- Google -->
    <a
            href="/oauth2/authorization/google"
            class="login-button google">
        Sign in with Google
    </a>

    <!-- GitHub -->
    <a
            href="/oauth2/authorization/github"
            class="login-button github">
        Sign in with GitHub
    </a>

</div>

</body>
</html>
